<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Apple — Инновации</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #000;
            color: white;
        }

        nav {
            height: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 35px;
            background: rgba(0, 0, 0, 0.9);
            position: sticky;
            top: 0;
        }

        nav a {
            color: #fff;
            text-decoration: none;
            font-size: 14px;
        }

        nav a:hover {
            color: #aaa;
        }

        .hero {
            min-height: 90vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px 20px;
        }

        .apple {
            font-size: 100px;
            margin-bottom: 20px;
        }

        h1 {
            font-size: 70px;
            margin-bottom: 15px;
        }

        .subtitle {
            font-size: 28px;
            color: #aaa;
            margin-bottom: 30px;
        }

        .button {
            display: inline-block;
            background: #0071e3;
            color: white;
            padding: 14px 28px;
            border-radius: 30px;
            text-decoration: none;
            font-size: 18px;
        }

        .button:hover {
            background: #0077ed;
        }

        .product {
            min-height: 80vh;
            background: #f5f5f7;
            color: #111;
            text-align: center;
            padding: 100px 20px;
        }

        .product h2 {
            font-size: 55px;
            margin-bottom: 15px;
        }

        .product p {
            font-size: 24px;
            color: #555;
            margin-bottom: 30px;
        }

        .phone {
            font-size: 180px;
            margin-top: 30px;
        }

        footer {
            padding: 30px;
            text-align: center;
            color: #777;
            background: #111;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 45px;
            }

            .subtitle {
                font-size: 20px;
            }

            .product h2 {
                font-size: 40px;
            }

            .apple {
                font-size: 70px;
            }
        }
    </style>
</head>

<body>

    <nav>
        <a href="#">Apple</a>
        <a href="#iphone">iPhone</a>
        <a href="#about">О компании</a>
    </nav>

    <section class="hero">
        <div class="apple">🍎</div>

        <h1>Apple</h1>

        <p class="subtitle">
            Think different.
        </p>

        <a href="#iphone" class="button">
            Узнать больше
        </a>
    </section>

    <section class="product" id="iphone">

        <h2>iPhone</h2>

        <p>
            Мощность. Красота. Инновации.
        </p>

        <div class="phone">📱</div>

        <a href="#about" class="button">
            Подробнее
        </a>

    </section>

    <section class="hero" id="about">

        <h1>Apple</h1>

        <p class="subtitle">
            Технологии, которые меняют будущее.
        </p>

    </section>

    <footer>
        © 2026 Apple Fan Website
    </footer>

</body>
</html>
